<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InventoryChanger — скачать</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e9eef5;
    --card: #ffffff;
    --ink: #101a33;
    --muted: #5b6784;
    --line: #d3dbe8;
    --accent: #2b57ff;
    --accent-dark: #1a3fd6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1220;
      --card: #151c30;
      --ink: #eef2fb;
      --muted: #97a3c0;
      --line: #263049;
      --accent: #5b82ff;
      --accent-dark: #3f66ea;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.55;
    display: grid;
    place-items: center;
    padding: 24px;
  }
  main {
    width: 100%;
    max-width: 560px;
  }
  h1 {
    font-family: "Unbounded", "Segoe UI", sans-serif;
    font-weight: 700;
    font-size: clamp(2rem, 7vw, 3.2rem);
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin-bottom: 16px;
  }
  .lead {
    color: var(--muted);
    font-size: 1.05rem;
    max-width: 44ch;
    margin-bottom: 32px;
  }
  .file {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 22px;
  }
  .file-head {
    display: flex;
    align-items: center;
    gap: 14px;
    padding-bottom: 18px;
    border-bottom: 1px dashed var(--line);
    margin-bottom: 18px;
  }
  .icon {
    flex: none;
    width: 46px;
    height: 56px;
    border-radius: 8px 14px 8px 8px;
    background: var(--accent);
    color: #fff;
    display: grid;
    place-items: end center;
    padding-bottom: 8px;
    font: 700 0.7rem "Unbounded", sans-serif;
  }
  .file-name { font-weight: 700; word-break: break-all; }
  .file-meta { color: var(--muted); font-size: 0.9rem; }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 16px 20px;
    border-radius: 12px;
    background: var(--accent);
    color: #fff;
    font: 700 1.05rem "Manrope", sans-serif;
    text-decoration: none;
    transition: background 0.15s, transform 0.1s;
  }
  .btn:hover { background: var(--accent-dark); }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .btn svg { width: 20px; height: 20px; }
  .hint {
    margin-top: 14px;
    color: var(--muted);
    font-size: 0.85rem;
    text-align: center;
  }
  @media (prefers-reduced-motion: reduce) {
    .btn { transition: none; }
  }
</style>
</head>
<body>
  <main>
    <h1>InventoryChanger</h1>
    <p class="lead">Скачайте программу и запустите её на своём компьютере.</p>

    <section class="file" aria-label="Файл для скачивания">
      <div class="file-head">
        <div class="icon" aria-hidden="true">ZIP</div>
        <div>
          <div class="file-name">inventorychanger.zip</div>
          <div class="file-meta">Версия 1.0 · Windows · 24 МБ</div>
        </div>
      </div>

      <!-- Поменяй href на путь к своему файлу, а download — на его имя -->
      <a class="btn" id="download" href="files/inventorychanger.zip" download="inventorychanger.zip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3v12m0 0l-5-5m5 5l5-5M4 20h16"/>
        </svg>
        <span id="label">Скачать</span>
      </a>
    </section>
  </main>

  <script>
    const btn = document.getElementById('download');
    const label = document.getElementById('label');
    btn.addEventListener('click', () => {
      label.textContent = 'Скачивание началось';
      setTimeout(() => { label.textContent = 'Скачать'; }, 3000);
    });
  </script>
</body>
</html>
